name: App checks

# Until this existed, nothing ran the app's own checks automatically: the two
# workflows in this repo published the policy site and pinged Supabase, so
# `npx jest` and `npx tsc --noEmit` were only ever run by hand, on one laptop,
# when someone remembered.
#
# Note what this can and cannot prove. Jest mocks the Supabase client, so a
# green run says nothing about whether the database refuses what we think it
# refuses. That is scripts/rls_probe.sql, which needs Docker and a seeded local
# stack and stays a manual pre-release step.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # postinstall runs patch-package, which re-applies the expo-modules-jsi
      # patches. They are iOS build fixes and apply fine here.
      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx jest --ci

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Gating since 2026-08-11: the bootstrap backlog (179 errors) was burned to
    # zero that day, so a red lint job means a NEW problem. Errors fail the
    # build; warnings (the 18 exhaustive-deps, kept advisory on purpose) do
    # not. The rule decisions and their reasons live in eslint.config.js.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
