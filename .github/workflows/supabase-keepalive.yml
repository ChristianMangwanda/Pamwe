name: Keep Supabase awake

# Free-tier Supabase pauses a project after about a week with no API activity,
# and a paused backend bricks every install at once: nobody can sign in, read,
# or reveal. Real daily use keeps it awake; this ping is the insurance for a
# quiet week. Delete this workflow if the project ever moves to Pro, which
# does not pause.
#
# Needs one repository secret: SUPABASE_ANON_KEY, the hosted anon key from
# .env.production (Settings -> Secrets and variables -> Actions). The query
# touches PostgREST and the database, which is what counts as activity; RLS
# means anon gets zero rows back, and that is fine, the request is the point.
#
# Caveat: GitHub disables scheduled workflows in repos with no activity for
# 60 days. Any push resets that clock, and GitHub emails a warning first.

on:
  schedule:
    - cron: '23 5 * * *' # daily, 05:23 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the REST API
        env:
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY secret is not set, so this ping cannot reach the project. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          curl -fsS "https://jcyhhxgomhopkoqesbkb.supabase.co/rest/v1/plans?select=id&limit=1" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            -o /dev/null -w 'HTTP %{http_code}\n'
