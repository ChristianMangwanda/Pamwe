<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pamwe Privacy Policy</title>
<meta name="description" content="What Pamwe collects, who can see it, and how to erase it.">
<meta name="color-scheme" content="light dark">
<style>
  :root {
    --bg: #EFE6D6;
    --surface: #F7F1E6;
    --ink: #2A2320;
    --ink2: #4C423C;
    --muted: #7A6E65;
    --line: #DCCFBA;
    --accent: #6B2421;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191512;
      --surface: #221D19;
      --ink: #F0E8DC;
      --ink2: #CFC3B4;
      --muted: #9A8E83;
      --line: #362E27;
      --accent: #D98A72;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink2);
    font: 17px/1.65 ui-serif, Georgia, "Times New Roman", serif;
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 44rem;
    margin: 0 auto;
    padding: 3rem 1.25rem 5rem;
  }
  h1, h2, h3 {
    color: var(--ink);
    line-height: 1.25;
    font-weight: 600;
  }
  h1 { font-size: 2rem; margin: 0 0 .35rem; letter-spacing: -.01em; }
  h2 { font-size: 1.35rem; margin: 3rem 0 .85rem; }
  h3 { font-size: 1.05rem; margin: 2rem 0 .6rem; }
  p, li { margin: 0 0 1rem; }
  ul { padding-left: 1.25rem; }
  li { margin-bottom: .5rem; }
  strong { color: var(--ink); font-weight: 600; }
  a { color: var(--accent); }
  hr {
    border: 0;
    border-top: 1px solid var(--line);
    margin: 2.75rem 0;
  }
  /* Wide tables scroll inside their own box so the page never scrolls sideways. */
  .table-wrap { overflow-x: auto; margin: 0 0 1.5rem; }
  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 34rem;
    font-size: .94rem;
    background: var(--surface);
  }
  th, td {
    border: 1px solid var(--line);
    padding: .6rem .75rem;
    text-align: left;
    vertical-align: top;
  }
  th { color: var(--ink); font-weight: 600; }
  blockquote {
    margin: 0 0 1.5rem;
    padding: .75rem 1rem;
    border-left: 3px solid var(--accent);
    background: var(--surface);
    color: var(--ink2);
  }
  footer {
    margin-top: 4rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: .875rem;
  }
</style>
</head>
<body>
<main>
{{CONTENT}}
<footer>Pamwe is a devotional app for couples. This page is the current privacy policy.</footer>
</main>
</body>
</html>
